name: check-skill-matrix

on:
  push:
    paths:
      - 'skills/_index.yml'
      - 'agent-skill-matrix.yml'
      - 'AGENT-SKILL-MATRIX.md'
      - 'agents/**'
  pull_request:
    paths:
      - 'skills/_index.yml'
      - 'agent-skill-matrix.yml'
      - 'AGENT-SKILL-MATRIX.md'
      - 'agents/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify skill matrix consistency
        run: node skills/shared/crctl/scripts/check-skill-matrix.mjs

      - name: Verify agents.contract invariants
        run: node skills/shared/crctl/scripts/check-agents-contract.mjs
