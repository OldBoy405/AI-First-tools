# tools/agents 预置 agent 台账（phase0 修订版）
# 仅登记当前 tools/skills/_index.yml 中存在的 active skill。

agents:
  - id: product-planning-agent
    name: Product Planning Agent
    path: ./product-planning-agent.md
    version: 0.2.0
    status: active
    scope: product
    mode: primary
    consumers: [orchestrator, product-planning.pipeline, market-to-plan.pipeline]
    brief: >-
      聚合 specs、CR、竞品、市场洞察、反馈与想法池，生成产品规划建议；
      草稿由 planning-draft 生成，落盘必须经 write-planning-entry 或 write-planning-report。
    entry:
      agent-doc: ./product-planning-agent.md
    capabilities:
      supported: [product-context-snapshot, planning-recommendation, planning-draft, planning-entry-write, roadmap-write]
      pending: []
    references:
      - tools/skills/planning/gather-product-context/SKILL.md
      - tools/skills/planning/planning-draft/SKILL.md
      - tools/skills/planning/write-planning-entry/SKILL.md
      - tools/skills/planning/write-planning-report/SKILL.md
      - tools/skills/planning/review-planning-report/SKILL.md
      - tools/skills/planning/write-roadmap/SKILL.md
      - tools/skills/spec/spec-query/SKILL.md
      - tools/skills/cr/cr-query/SKILL.md
      - tools/skills/cr/cr-dashboard/SKILL.md
      - tools/skills/shared/engineering-docs/SKILL.md
      - tools/skills/shared/validate-doc/SKILL.md

  - id: requirement-writer
    name: Requirement Writer
    path: ./requirement-writer.md
    version: 1.1.0
    status: active
    scope: requirement
    mode: primary
    consumers: [orchestrator, requirement-authoring.pipeline]
    brief: >-
      需求期全程负责 Agent。驱动 CR 从注册、PRD 编写、需求评审到人工审批后的
      approve-requirement 状态推进；注册时必须写入需求/开发/测试三角色 owner 与 assigned-at，
      产物写入 change-requests/{CR-ID}/。
    entry:
      agent-doc: ./requirement-writer.md
    capabilities:
      supported: [CR-register, PRD-write, requirement-review, requirement-approve, progress-push]
      pending: []
    references:
      - tools/skills/requirement/requirement-register/SKILL.md
      - tools/skills/requirement/write-requirement-prd/SKILL.md
      - tools/skills/requirement/review-requirement/SKILL.md
      - tools/skills/requirement/approve-requirement/SKILL.md
      - tools/skills/sync/push-progress/SKILL.md
      - tools/skills/sync/handover-cr/SKILL.md
      - tools/skills/cr/cr-show/SKILL.md
      - tools/skills/cr/cr-query/SKILL.md

  - id: dev-agent
    name: Dev Agent
    path: ./dev-agent.md
    version: 0.2.0
    status: active
    scope: develop
    mode: primary
    consumers: [orchestrator, architecture-design.pipeline, code-implementation.pipeline]
    brief: >-
      开发期全程负责 Agent。读取 CR owners.development / owners.test 作为开发与测试责任归属，
      驱动 CR 从 requirement-approved 经 SDD、技术评审、
      approve-tech-design、计划与任务拆分、approve-dev-start、代码实现、测试报告、代码评审、approve-code 到 code-approved。
    entry:
      agent-doc: ./dev-agent.md
    capabilities:
      supported: [SDD-write, tech-design-review, tech-design-approve, dev-plan-write, dev-task-write, dev-start-approve, code-write, test-report-write, code-review, code-approve]
      pending: []
    references:
      - tools/skills/develop/write-tech-design/SKILL.md
      - tools/skills/develop/review-tech-design/SKILL.md
      - tools/skills/develop/approve-tech-design/SKILL.md
      - tools/skills/develop/write-dev-plan/SKILL.md
      - tools/skills/develop/write-dev-tasks/SKILL.md
      - tools/skills/develop/approve-dev-start/SKILL.md
      - tools/skills/develop/implement-code/SKILL.md
      - tools/skills/develop/write-test-report/SKILL.md
      - tools/skills/develop/review-code/SKILL.md
      - tools/skills/develop/approve-code/SKILL.md
      - tools/skills/sync/push-progress/SKILL.md
      - tools/skills/cr/cr-show/SKILL.md

  - id: spec-agent
    name: Spec Agent
    path: ./spec-agent.md
    version: 0.2.0
    status: active
    scope: spec-query
    mode: subagent
    consumers: [orchestrator, feature-writeback.pipeline]
    brief: >-
      specs/ 基线知识的只读查询与回写后核对 Agent。新 PRD/SDD 不在 specs/ 直接编写，
      只由 feature-writeback pipeline 中的 system-orchestrator 编排回写。
    entry:
      agent-doc: ./spec-agent.md
    capabilities:
      supported: [spec-show, spec-query, spec-dashboard, writeback-verification]
      pending: []
    references:
      - tools/skills/spec/spec-show/SKILL.md
      - tools/skills/spec/spec-query/SKILL.md
      - tools/skills/spec/spec-dashboard/SKILL.md
      - tools/skills/cr/cr-query/SKILL.md
      - tools/skills/cr/cr-show/SKILL.md

  - id: delivery-agent
    name: Delivery Agent
    path: ./delivery-agent.md
    version: 0.2.0
    status: active
    scope: delivery-writeback
    mode: subagent
    consumers: [orchestrator, feature-writeback.pipeline]
    brief: >-
      交付任务回写 Agent。仅在 writeback 阶段将 CR tasks/ 映射到 delivery/task/，
      维护 delivery/task/_index.yaml；不再提供旧式 PLAN/RELEASE 写入入口。
    entry:
      agent-doc: ./delivery-agent.md
    capabilities:
      supported: [task-writeback]
      pending: []
    references:
      - tools/skills/writeback/writeback-tasks/SKILL.md
      - tools/skills/shared/validate-doc/SKILL.md

  - id: quality-reviewer-agent
    name: Quality Reviewer Agent
    path: ./quality-reviewer-agent.md
    version: 0.2.0
    status: active
    scope: quality-gate
    mode: subagent
    consumers: [requirement-authoring.pipeline, architecture-design.pipeline, code-implementation.pipeline, feature-writeback.pipeline]
    brief: >-
      CR 质量门统一入口。路由到 review-requirement、review-tech-design、review-dev-plan、review-code、
      review-alignment，并汇总 blocker 与下一步。
    entry:
      agent-doc: ./quality-reviewer-agent.md
    capabilities:
      supported: [requirement-review, tech-design-review, dev-plan-review, code-review, review-alignment]
      pending: []
    references:
      - tools/skills/requirement/review-requirement/SKILL.md
      - tools/skills/planning/review-planning-report/SKILL.md
      - tools/skills/develop/review-tech-design/SKILL.md
      - tools/skills/develop/review-dev-plan/SKILL.md
      - tools/skills/develop/write-test-report/SKILL.md
      - tools/skills/develop/review-code/SKILL.md
      - tools/skills/review/review-alignment/SKILL.md
      - tools/skills/reviewer-panel.yaml

  - id: knowledge-agent
    name: Knowledge Agent
    path: ./knowledge-agent.md
    version: 0.1.0
    status: active
    scope: knowledge
    mode: subagent
    consumers: [orchestrator]
    brief: >-
      负责 docs/ 下跨特性知识的写入与维护，包括技术笔记、市场洞察、产品规划辅助资料。
      docs/references/ 只读。
    entry:
      agent-doc: ./knowledge-agent.md
    capabilities:
      supported: [design-doc-support]
      pending: [tech-note-write, insight-write]
    references:
      - tools/skills/shared/validate-doc/SKILL.md

  - id: competitive-analyst-agent
    name: Competitive Analyst Agent
    path: ./competitive-analyst-agent.md
    version: 0.2.0
    status: active
    scope: competitive
    mode: primary
    consumers: [orchestrator, product-planning-agent, competitive-radar.pipeline]
    brief: >-
      抓取竞品官网与近期公开动态，生成独立竞品分析报告，并可转为规划建议草稿；
      草稿落盘必须经 write-planning-entry。
    entry:
      agent-doc: ./competitive-analyst-agent.md
    capabilities:
      supported: [competitor-update-fetch, competitive-report, report-to-planning, planning-entry-write]
      pending: []
    references:
      - tools/skills/competitive/fetch-competitor-updates/SKILL.md
      - tools/skills/competitive/write-competitive-report/SKILL.md
      - tools/skills/competitive/report-to-planning-suggestion/SKILL.md
      - tools/skills/planning/write-planning-entry/SKILL.md
      - tools/skills/planning/gather-product-context/SKILL.md
      - tools/skills/planning/planning-draft/SKILL.md
      - tools/skills/shared/engineering-docs/SKILL.md
      - tools/skills/shared/validate-doc/SKILL.md

  - id: customer-support-agent
    name: Customer Support Agent
    path: ./customer-support-agent.md
    version: 0.1.0
    status: active
    scope: customer-support
    mode: primary
    consumers: [orchestrator, customer-support]
    brief: >-
      面向客户支持人员的问答 Agent。优先依据 specs 中的 PRD/SDD 回答产品功能、
      使用路径与功能组合问题；文档不足时记录到 docs/feedback/。
    entry:
      agent-doc: ./customer-support-agent.md
    capabilities:
      supported: [product-doc-qa, tech-doc-qa, usage-guidance, implementation-explain]
      pending: [unresolved-feedback-record]
    references:
      - tools/skills/spec/spec-query/SKILL.md
      - tools/skills/spec/spec-show/SKILL.md
      - tools/skills/shared/validate-doc/SKILL.md
      - specs/_index.yml
      - docs/feedback/_index.yml
