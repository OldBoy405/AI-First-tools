# agent-skill-matrix.yml — Agent / Skill 权限与归属矩阵
schema: "ai-first.tools.agent-skill-matrix/v1"
updated-at: "2026-07-26"

relation-types:
  owns: "主责维护与默认执行；每个 active skill 必须且只能有一个 owns owner"
  can-call: "可在职责边界内调用；不代表主责"
  external: "目标运行时提供的外部方法论 Skill；phase0 tools 不打包"
  forbidden: "明确禁止调用，避免跨域越权"

pipeline-owners:
  product-planning: product-planning-agent
  market-to-plan: product-planning-agent
  competitive-radar: competitive-analyst-agent
  requirement-authoring: requirement-writer
  architecture-design: dev-agent
  code-implementation: dev-agent
  feature-writeback: system-orchestrator
  resume-cr: system-orchestrator

actors:
  product-planning-agent:
    kind: agent
    owns:
      - analyze-user-feedback
      - conduct-market-research
      - run-competitive-analysis
      - analyze-current-product
      - write-planning-report
      - review-planning-report
      - write-roadmap
      - write-planning-entry
      - extract-market-insight
      - write-insight-brief
      - gather-product-context
      - planning-draft
      - record-idea
      - record-adr
      - focus-briefing
    can-call:
      - spec-query
      - cr-query
      - cr-dashboard
      - engineering-docs
      - validate-doc
    external:
      - brainstorming
    forbidden:
      - requirement-register
      - implement-code
      - merge-feature-branch
      - cr-status-set
      - cr-archive

  requirement-writer:
    kind: agent
    owns:
      - requirement-register
      - write-requirement-prd
      - review-requirement
      - approve-requirement
    can-call:
      - push-progress
      - cr-show
      - cr-query
      - handover-cr
      - inbox-emit
      - crctl
    external: []
    forbidden:
      - writeback-prd-sdd
      - implement-code
      - merge-feature-branch
      - cr-status-set
      - cr-archive

  dev-agent:
    kind: agent
    owns:
      - write-tech-design
      - review-tech-design
      - approve-tech-design
      - write-dev-plan
      - write-dev-tasks
      - approve-dev-start
      - implement-code
      - write-test-report
      - review-code
      - approve-code
    can-call:
      - push-progress
      - pull-progress
      - cr-show
      - controlled-shell
      - crctl
    external:
      - executing-plans
      - subagent-driven-development
      - test-driven-development
    forbidden:
      - writeback-prd-sdd
      - merge-feature-branch
      - cr-status-set
      - cr-archive

  spec-agent:
    kind: agent
    owns:
      - spec-show
      - spec-query
      - spec-dashboard
    can-call:
      - cr-query
      - cr-show
    external: []
    forbidden:
      - requirement-register
      - implement-code
      - cr-status-set
      - writeback-prd-sdd
      - writeback-traceability

  delivery-agent:
    kind: agent
    owns:
      - writeback-tasks
    can-call:
      - validate-doc
      - writeback-traceability
    external: []
    forbidden:
      - write-requirement-prd
      - write-tech-design
      - implement-code

  quality-reviewer-agent:
    kind: agent
    owns:
      - review-alignment
      - change-impact-analysis
    can-call:
      - review-planning-report
      - review-requirement
      - review-tech-design
      - write-test-report
      - review-code
      - cr-show
    external: []
    forbidden:
      - approve-requirement
      - approve-tech-design
      - approve-code
      - cr-status-set

  knowledge-agent:
    kind: agent
    owns: []
    can-call:
      - engineering-docs
      - validate-doc
      - record-idea
      - record-adr
      - write-insight-brief
    external: []
    forbidden:
      - requirement-register
      - implement-code
      - merge-feature-branch
      - cr-status-set

  competitive-analyst-agent:
    kind: agent
    owns:
      - fetch-competitor-updates
      - write-competitive-report
      - report-to-planning-suggestion
    can-call:
      - gather-product-context
      - planning-draft
      - write-planning-entry
      - engineering-docs
      - validate-doc
    external:
      - brainstorming
    forbidden:
      - conduct-market-research
      - requirement-register
      - implement-code
      - cr-status-set

  customer-support-agent:
    kind: agent
    owns: []
    can-call:
      - spec-show
      - spec-query
      - validate-doc
    external: []
    forbidden:
      - requirement-register
      - write-requirement-prd
      - implement-code
      - cr-status-set

  system-orchestrator:
    kind: system
    owns:
      - merge-feature-branch
      - writeback-prd-sdd
      - writeback-traceability
      - push-progress
      - pull-progress
      - resume-from-remote
      - list-remote-checkpoints
      - handover-cr
      - validate-doc
      - engineering-docs
      - controlled-shell
      - crctl
      - cr-review-record
      - cr-status-set
      - inbox-emit
      - cr-archive
      - feedback-writeback
      - cr-inbox
      - cr-query
      - cr-show
      - cr-dashboard
    can-call: []
    external:
      - using-superpowers
      - writing-plans
      - verification-before-completion
    forbidden: []

external-skills:
  - using-superpowers
  - brainstorming
  - writing-plans
  - executing-plans
  - subagent-driven-development
  - test-driven-development
  - systematic-debugging
  - verification-before-completion

known-gaps:
  - id: knowledge-agent-write-skills
    owner: knowledge-agent
    description: "knowledge-agent 声明 tech-note-write / insight-write，但 phase0 尚未提供专属写入 Skill；当前只能复用 engineering-docs、record-idea、record-adr 与 write-insight-brief。"
  - id: customer-support-feedback-write
    owner: customer-support-agent
    description: "customer-support-agent 声明 unresolved-feedback-record，但 phase0 尚未提供 record-feedback Skill；落盘反馈应在后续补专用 Skill 或绑定到目标系统工单入口。"
  - id: writeback-agent-entry
    owner: system-orchestrator
    description: "feature-writeback 当前由 system-orchestrator 直接编排 writeback / delivery / CR Skill；spec-agent 仅做回写后只读核对。若后续需要人工主入口，可新增 writeback-agent。"
