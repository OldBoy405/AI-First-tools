# OpenAPI 3.0 接口定义模板
# 由 engineering-docs skill 渲染生成
# 对应 MODULE: <%= moduleId || '待绑定' %>
openapi: 3.0.3
info:
  title: <%= title %>
  description: <%= description || 'Generated by engineering-docs skill' %>
  version: "<%= version %>"
  contact:
    name: <%= owner %>
servers:
  - url: https://example.com/api
    description: placeholder

tags:
  - name: <%= name %>
    description: <%= title %>

paths:
  /<%= name %>/ping:
    get:
      tags: [<%= name %>]
      summary: 健康检查（占位端点，请按 MODULE BH-XX 替换）
      operationId: <%= name %>Ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

components:
  schemas:
    PingResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
